<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123f2e">
<title>Accounts Desk - __TITLE__</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #eef2ef; padding: 20px; color: #16231d;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  form { background: #fff; border: 1px solid #d3ddd7; border-radius: 14px; padding: 26px 22px;
         width: 100%; max-width: 380px; box-shadow: 0 6px 24px rgba(18,63,46,.08); }
  h1 { margin: 0 0 4px; font-size: 20px; color: #123f2e; }
  p.sub { margin: 0 0 20px; font-size: 13px; color: #66756d; }
  label { display: block; margin-bottom: 14px; font-size: 12px; font-weight: 600; color: #66756d;
          text-transform: uppercase; letter-spacing: .04em; }
  input { width: 100%; margin-top: 6px; padding: 12px; font-size: 16px; border: 1px solid #d3ddd7;
          border-radius: 9px; font-family: inherit; text-transform: none; }
  input:focus { outline: 2px solid #123f2e; outline-offset: -1px; }
  button { width: 100%; margin-top: 6px; padding: 13px; font-size: 15px; font-weight: 700; color: #fff;
           background: #123f2e; border: 0; border-radius: 9px; cursor: pointer; font-family: inherit; }
  .err { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: #fde8e6;
         color: #b42318; font-size: 13px; }
</style></head>
<body>__BODY__</body></html>
